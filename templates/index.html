<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Gameplan Agent</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f7f8fc; color: #111827; }
      .page { max-width: 900px; margin: 0 auto; padding: 32px; }
      h1 { margin-bottom: 0.3em; }
      .card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08); }
      label { display: block; margin-top: 18px; font-weight: 600; }
      input, textarea { width: 100%; padding: 12px 14px; margin-top: 8px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 1rem; }
      textarea { min-height: 120px; resize: vertical; }
      .buttons { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
      button { padding: 12px 18px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; }
      .primary { background: #4f46e5; color: white; }
      .secondary { background: #e5e7eb; color: #111827; }
      .error { margin-top: 16px; color: #b91c1c; }
      .output { white-space: pre-wrap; background: #111827; color: #f9fafb; padding: 20px; border-radius: 18px; margin-top: 24px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>7-Day Content Gameplan</h1>
        <p>Create a full week of social content with hooks, CTAs, and AI scaling tips.</p>
        <form method="post" action="/">
          <label for="niche">Niche</label>
          <input id="niche" name="niche" value="{{ niche }}" placeholder="e.g. fitness coaching, AI marketing, ecommerce" required />

          <label for="goal">Primary goal</label>
          <input id="goal" name="goal" value="{{ goal }}" placeholder="e.g. grow brand authority, convert leads, build community" />

          <div class="buttons">
            <button class="primary" type="submit">Generate Gameplan</button>
            <button class="secondary" type="submit" formaction="/download">Download Markdown</button>
          </div>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if plan %}
        <div class="output">{{ plan }}</div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
